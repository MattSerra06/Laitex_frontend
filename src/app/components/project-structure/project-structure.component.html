<nav class="structure" aria-label="Project structure">
  <header class="structure__header">
    <h2>Project</h2>
    <button mat-icon-button type="button" class="structure__refresh" aria-label="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>
  </header>
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="structure__tree">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
      <button mat-icon-button disabled class="structure__leaf-icon" tabindex="-1">
        <mat-icon>description</mat-icon>
      </button>
      <button
        class="structure__node"
        type="button"
        [class.structure__node--active]="activeFile() === node.name"
        (click)="openNode(node)"
      >
        {{ node.name }}
      </button>
    </mat-tree-node>

    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
      <div class="structure__folder" matTreeNodePadding>
        <button mat-icon-button matTreeNodeToggle type="button" aria-label="Toggle folder">
          <mat-icon class="structure__folder-icon">
            {{ treeControl.isExpanded(node) ? 'folder_open' : 'folder' }}
          </mat-icon>
        </button>
        <button class="structure__node" type="button" (click)="openNode(node)">
          {{ node.name }}
        </button>
      </div>
      <div [class.structure__children--collapsed]="!treeControl.isExpanded(node)" class="structure__children">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>
</nav>
