<mat-sidenav-container class="workspace">
  <mat-sidenav
    #drawer
    [mode]="sidenavMode()"
    [opened]="!isHandset() || drawerOpen()"
    (openedChange)="drawerOpen.set($event)"
    class="workspace__drawer"
  >
    <app-project-structure></app-project-structure>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <div class="topbar__section topbar__section--left">
        <button
          mat-icon-button
          type="button"
          aria-label="Toggle structure"
          class="topbar__menu"
          (click)="toggleDrawer()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <div class="topbar__branding">
          <span class="topbar__logo">λ</span>
          <div class="topbar__titles">
            <span class="topbar__name">Laitex Studio</span>
            <small class="topbar__subtitle">Minimal collaborative LaTeX workspace</small>
          </div>
        </div>
      </div>

      <div class="topbar__section topbar__section--right">
        <button mat-icon-button matTooltip="Sync status" type="button">
          <mat-icon>sync</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Project history" type="button">
          <mat-icon>history</mat-icon>
        </button>
        <mat-divider [vertical]="true"></mat-divider>
        <button mat-icon-button matTooltip="Toggle theme" type="button" (click)="toggleTheme()">
          <mat-icon>{{ themeMode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <button mat-flat-button color="primary" type="button" class="topbar__primary">
          <mat-icon>upload</mat-icon>
          Share
        </button>
      </div>
    </mat-toolbar>

    <section class="workspace__content">
      <div class="workspace__panel workspace__panel--editor">
        <app-latex-editor></app-latex-editor>
      </div>
      <div class="workspace__panel workspace__panel--preview">
        <app-latex-preview></app-latex-preview>
      </div>
    </section>

    <app-chat-widget></app-chat-widget>
  </mat-sidenav-content>
</mat-sidenav-container>
